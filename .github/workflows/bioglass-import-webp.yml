name: Import reviewed BioGlass web assets
on:
  push:
    branches: [feature/bioglass-asset-first-skeleton]
    paths:
      - "assets/bioglass/TRANSFER_READY.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download the one-use Dropbox transfer through private intake route
        env:
          ASSET_URL: https://bioglass-nima-preview.zh13.workers.dev/_bioglass-intake-20261011-s7LqPf2048.zip
        run: |
          curl --fail --location --silent --show-error --max-time 150 "$ASSET_URL" -o /tmp/bioglass-assets.zip
          test "$(wc -c < /tmp/bioglass-assets.zip)" -gt 3500000
          test "$(wc -c < /tmp/bioglass-assets.zip)" -lt 14000000
      - name: Verify 20 assets and install WebP files into public tree
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, re, hashlib, json
          root=pathlib.Path('public/assets/bioglass')
          root.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile('/tmp/bioglass-assets.zip') as z:
            assets=[n for n in z.namelist() if re.fullmatch(r'webp_optimized/G(?:0[1-9]|1[0-9]|20)_[a-z0-9-]+\.webp',n)]
            ids={n.rsplit('/',1)[1][:3] for n in assets}
            assert len(assets)==20 and ids=={'G%02d'%i for i in range(1,21)},'Unexpected 20-asset set'
            report=[]
            for name in sorted(assets):
              data=z.read(name)
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP','Bad WebP magic'
              assert len(data)<1500000,'Oversized artwork'
              path=root/name.rsplit('/',1)[1]
              path.write_bytes(data)
              report.append(dict(id=path.name[:3],path='/assets/bioglass/'+path.name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          pathlib.Path('assets/bioglass/ASSET_INSTALL_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          print('Imported verified WebP artwork:',len(report))
          PY
      - name: Commit verified artwork to existing draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/bioglass assets/bioglass/ASSET_INSTALL_REPORT.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: import 20 original WebP illustrations from Dropbox"
            git pull --rebase origin feature/bioglass-asset-first-skeleton
            git push origin HEAD:feature/bioglass-asset-first-skeleton
          fi
