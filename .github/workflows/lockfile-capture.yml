name: Temporary Three.js lockfile capture
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/bioglass-asset-first-skeleton'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global npm@11
      - name: Regenerate lock without installing node_modules
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Print lock content for reviewable repository commit
        run: |
          node -e '
            const fs = require("node:fs");
            const b = fs.readFileSync("package-lock.json").toString("base64");
            for(let i=0;i<b.length;i+=2000) console.log("BGLOCKCHUNK:" + b.slice(i,i+2000));
            console.log("BGLOCKDONE:" + b.length);
          '
